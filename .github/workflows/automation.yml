name: Auto Copy Stock Database

# 每天台灣時間下午五點執行 (UTC 09:00)
on:
  schedule:
    - cron: '0 9 * * *'  # 台灣時間 17:00 = UTC 09:00
  workflow_dispatch:  # 保留手動觸發選項

jobs:
  copy-database:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Copy stock_hot.db to StockTracker
      run: |
        # 確保目標目錄存在
        mkdir -p StockTracker/StockInfo
        
        # 複製資料庫檔案
        cp StockTrend/stock_data/stock_hot.db StockTracker/StockInfo/
        
        echo "Database file copied successfully"
        
    - name: Commit and push changes
      run: |
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        git add StockTracker/StockInfo/stock_hot.db
        
        # 只有在有變更時才 commit
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto update stock_hot.db - $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
          git push
        fi
