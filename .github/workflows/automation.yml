name: Auto Copy Stock Database

# 每天台灣時間下午五點執行 (UTC 09:00)
on:
  schedule:
    - cron: '0 9 * * *'  # 台灣時間 17:00 = UTC 09:00
  workflow_dispatch:  # 保留手動觸發選項

permissions:
  contents: write  # 給予寫入權限

jobs:
  copy-database:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.x'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pandas numpy plotly requests beautifulsoup4 lxml
        
    - name: Run StockTrend2.py
      run: python StockTrend2.py
        
    - name: Copy stock_hot.db to StockTracker
      run: |
        # 複製檔案到臨時位置
        mkdir -p /tmp/stock_db
        cp stock_data/stock_hot.db /tmp/stock_db/
        
    - name: Checkout StockTracker repository
      uses: actions/checkout@v4
      with:
        repository: ccupcpop/StockTracker
        path: StockTracker
        token: ${{ secrets.GITHUB_TOKEN }}
        
    - name: Copy and push to StockTracker
      run: |
        # 確保目標目錄存在
        mkdir -p StockTracker/StockInfo
        
        # 複製資料庫檔案
        cp /tmp/stock_db/stock_hot.db StockTracker/StockInfo/
        
        # 進入 StockTracker 目錄
        cd StockTracker
        
        # 設定 Git
        git config --local user.email "github-actions[bot]@users.noreply.github.com"
        git config --local user.name "github-actions[bot]"
        
        # 檢查是否有變更
        git add StockInfo/stock_hot.db
        
        if git diff --staged --quiet; then
          echo "No changes to commit"
        else
          git commit -m "Auto update stock_hot.db - $(TZ=Asia/Taipei date '+%Y-%m-%d %H:%M:%S')"
          git push
        fi
        
        echo "Database file updated successfully"
